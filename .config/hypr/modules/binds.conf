$terminal = kitty
$fileManager = nautilus
$launcher = pkill rofi || rofi -show drun
$browser = google-chrome-stable
$codeEditor = code
$wallpaperPicker = waypaper

# powermenu
bind = SUPER, Escape, exec, pkill rofi || ~/.config/rofi/powermenu/powermenu.sh

# shutdown
bind = SUPER SHIFT, Escape, exec, command -v hyprshutdown >/dev/null 2>&1 && hyprshutdown || hyprctl dispatch exit

# screenshot
bind = SUPER, PRINT, exec, hyprshot -m window

# open apps
bind = SUPER, B, exec, $browser
bind = SUPER, C, exec, $codeEditor
bind = SUPER, F, exec, $fileManager
bind = SUPER, P, exec, hyprpicker -a
bind = SUPER, W, exec, $wallpaperPicker
bind = SUPER, Space, exec, $launcher
bind = SUPER, Return, exec, $terminal

# do things (for now)
bind = SUPER, V, togglefloating
bind = SUPER, X, killactive,
bind = SUPER, J, layoutmsg, togglesplit # dwindle

# cycle through workspaces
bind = ALT, Tab, workspace, m+1 # forward
bind = SUPER, Tab, workspace, m-1 # backward
# bind = ALT, Tab, workspace, previous # bounce between last 2 workspaces
bind = SUPER SHIFT, right, workspace, m+1 # forward
bind = SUPER SHIFT, left, workspace, m-1 # backward

# run refresh script
bind = SUPER SHIFT, R, exec, ~/.local/bin/refresh.sh

# Move focus with SUPER + arrow keys
bind = SUPER, left, movefocus, l
bind = SUPER, right, movefocus, r
bind = SUPER, up, movefocus, u
bind = SUPER, down, movefocus, d

# Switch workspaces with SUPER + [0-9]
bind = SUPER, 1, workspace, 1
bind = SUPER, 2, workspace, 2
bind = SUPER, 3, workspace, 3
bind = SUPER, 4, workspace, 4
bind = SUPER, 5, workspace, 5
bind = SUPER, 6, workspace, 6
bind = SUPER, 7, workspace, 7
bind = SUPER, 8, workspace, 8
bind = SUPER, 9, workspace, 9
bind = SUPER, 0, workspace, 10

# Move active window to a workspace withSUPER + SHIFT + [0-9]
bind = SUPER SHIFT, 1, movetoworkspace, 1
bind = SUPER SHIFT, 2, movetoworkspace, 2
bind = SUPER SHIFT, 3, movetoworkspace, 3
bind = SUPER SHIFT, 4, movetoworkspace, 4
bind = SUPER SHIFT, 5, movetoworkspace, 5
bind = SUPER SHIFT, 6, movetoworkspace, 6
bind = SUPER SHIFT, 7, movetoworkspace, 7
bind = SUPER SHIFT, 8, movetoworkspace, 8
bind = SUPER SHIFT, 9, movetoworkspace, 9
bind = SUPER SHIFT, 0, movetoworkspace, 10

# Example special workspace (scratchpad)
bind = SUPER, S, togglespecialworkspace, magic
bind = SUPER SHIFT, S, movetoworkspace, special:magic

# Scroll through existing workspaces with SUPER + scroll
bind = SUPER, mouse_down, workspace, e+1
bind = SUPER, mouse_up, workspace, e-1

# Move/resize windows with SUPER + LMB/RMB and dragging
bindm = SUPER, mouse:272, movewindow
bindm = SUPER, mouse:273, resizewindow

# Volume 
bindel = , XF86AudioRaiseVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+ -l 1.2
bindel = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindel = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindel = , XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle

# Brightness
bindel = , XF86MonBrightnessUp, exec, brightnessctl set +5%
bindel = , XF86MonBrightnessDown, exec, brightnessctl set 5%-

# Requires playerctl
bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPause, exec, playerctl play-pause
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioPrev, exec, playerctl previous

