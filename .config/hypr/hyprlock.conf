$font = FiraCode Nerd Font Mono

general {
  hide_cursor = false
  fail_timeout = 10
}

# uncomment to enable fingerprint authentication
# auth {
#     fingerprint {
#         enabled = true
#         ready_message = Scan fingerprint to unlock
#         present_message = Scanning...
#         retry_delay = 250 # in milliseconds
#     }
# }

animations {
  enabled = true
  bezier = custom, 0.05, 0.7, 0.1,  1
  animation = fadeIn, 1, 5, custom
  animation = fadeOut, 1, 5, custom
  animation = inputFieldDots, 1, 2, custom
}

background {
    monitor =
    path = ~/Pictures/Wallpapers/forest.jpg
    blur_passes = 3
    blur_size   = 5
    brightness  = 0.9
    vibrancy    = 0.1
}


input-field {
    monitor =
    size = 20%, 5%
    outline_thickness = 2
    inner_color = rgba(189, 255, 225, 0.6)

    outer_color = rgba(189, 255, 225, 0.8)
    fail_color = rgba(ff6633ee)

    font_color = rgb(26, 50, 44)
    fade_on_empty = false
    rounding = 100

    font_family = $font
    placeholder_text = 
    fail_text = $PAMFAIL

    # uncomment if you wish to display a message during authentication
    # check_text = Authenticating...
    # check_color = rgba(00ff99ee) rgba(ff6633ee) 120deg

    # uncomment to use a letter instead of a dot to indicate the typed password
    # dots_text_format = *
    # dots_size = 0.4
    dots_spacing = 0.3

    # uncomment to use an input indicator that does not show the password length (similar to swaylock's input indicator)
    # hide_input = true

    position = 0, 0
    halign = center
    valign = center
}

# TIME
label {
    monitor =
    text = $TIME # ref. https://wiki.hyprland.org/Hypr-Ecosystem/hyprlock/#variable-substitution
    font_size = 90
    font_family = $font
    color = rgb(189, 255, 225) 
    position = 0, -200
    halign = center
    valign = top
}

# DATE
label {
    monitor =
    text = cmd[update:60000] date +"%A, %d %B %Y" # update every 60 seconds
    font_size = 25
    font_family = $font
    color = rgb(189, 255, 225) 
    position = 0, -350
    halign = center
    valign = top
}

